<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Christmas Bible Verses</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;

            background: linear-gradient(
                135deg,
                #063b2c,
                #145c3b,
                #092d24
            );

            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 80%;
            max-width: 600px;

            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #d4af37;
            border-radius: 20px;

            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        .quote {
            font-size: 26px;
            line-height: 1.6;
            margin: 30px 0;
            color: white;
        }

        .citation {
            color: #ffd700;
            font-style: italic;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <p class="quote" id="quote"></p>

        <p class="citation" id="citation"></p>

    </div>

    <script>
        const quotes = [
            {
                text: "El ángel, entrando en su presencia, dijo: «Alégrate, llena de gracia, el Señor está contigo». Ella se turbó grandemente ante estas palabras y se preguntaba qué saludo era aquel.",
                citation: "Lc 1,28-29"
            },
            {
                text: "Pero, apenas había tomado esta resolución, se le apareció en sueños un ángel del Señor que le dijo: «José, hijo de David, no temas acoger a María, tu mujer, porque la criatura que hay en ella viene del Espíritu Santo.",
                citation: "Mt 1,20"
            },
            {
                text: "En aquellos mismos días, María se levantó y se puso en camino de prisa hacia la montaña, a una ciudad de Judá; entró en casa de Zacarías y saludó a Isabel. Aconteció que, en cuanto Isabel oyó el saludo de María, saltó la criatura en su vientre. Se llenó Isabel de Espíritu Santo y, levantando la voz, exclamó: «¡Bendita tú entre las mujeres, y bendito el fruto de tu vientre! ¿Quién soy yo para que me visite la madre de mi Señor? Pues, en cuanto tu saludo llegó a mis oídos, la criatura saltó de alegría en mi vientre. Bienaventurada la que ha creído, porque lo que le ha dicho el Señor se cumplirá».",
                citation: "Lc 1,39-45"
            },
            {
                text: "Sucedió en aquellos días que salió un decreto del emperador Augusto, ordenando que se empadronase todo el Imperio.",
                citation: "Lc 2,1"
            },
            {
                text: "Y todos iban a empadronarse, cada cual a su ciudad. También José, por ser de la casa y familia de David, subió desde la ciudad de Nazaret, en Galilea, a la ciudad de David, que se llama Belén, en Judea, para empadronarse con su esposa María, que estaba encinta.",
                citation: "Lc 2,3-5"
            },
            {
                text: "Sucedió en aquellos días que salió un decreto del emperador Augusto, ordenando que se empadronase todo el Imperio. Este primer empadronamiento se hizo siendo Cirino gobernador de Siria. Y todos iban a empadronarse, cada cual a su ciudad. También José, por ser de la casa y familia de David, subió desde la ciudad de Nazaret, en Galilea, a la ciudad de David, que se llama Belén, en Judea, para empadronarse con su esposa María, que estaba encinta. Y sucedió que, mientras estaban allí, le llegó a ella el tiempo del parto y dio a luz a su hijo primogénito, lo envolvió en pañales y lo recostó en un pesebre, porque no había sitio para ellos en la posada.",
                citation: "Lc 2,1-7 MUY LARGA??? INCLUYE OTRAS (Lc 2,7b)"
            },
            {
                text: "Y sucedió que, mientras estaban allí, le llegó a ella el tiempo del parto y dio a luz a su hijo primogénito, lo envolvió en pañales y lo recostó en un pesebre, porque no había sitio para ellos en la posada.",
                citation: "Lc 2,6-7 (Lc 2,6-7a)"
            },
            {
                text: "En aquella misma región había unos pastores que pasaban la noche al aire libre, velando por turno su rebaño. De repente un ángel del Señor se les presentó; la gloria del Señor los envolvió de claridad, y se llenaron de gran temor. El ángel les dijo: «No temáis, os anuncio una buena noticia que será de gran alegría para todo el pueblo: hoy, en la ciudad de David, os ha nacido un Salvador, el Mesías, el Señor. Y aquí tenéis la señal: encontraréis un niño envuelto en pañales y acostado en un pesebre». De pronto, en torno al ángel, apareció una legión del ejército celestial, que alababa a Dios diciendo: «Gloria a Dios en el cielo, y en la tierra paz a los hombres de buena voluntad». Y sucedió que, cuando los ángeles se marcharon al cielo, los pastores se decían unos a otros: «Vayamos, pues, a Belén, y veamos lo que ha sucedido y que el Señor nos ha comunicado». Fueron corriendo y encontraron a María y a José, y al niño acostado en el pesebre. Al verlo, contaron lo que se les había dicho de aquel niño. Todos los que lo oían se admiraban de lo que les habían dicho los pastores. María, por su parte, conservaba todas estas cosas, meditándolas en su corazón. Y se volvieron los pastores dando gloria y alabanza a Dios por todo lo que habían oído y visto, conforme a lo que se les había dicho.",
                citation: "Lc 2,8-20"
            },
            {
                text: "Esta es la alianza que habréis de guardar, una alianza entre yo y vosotros y tus descendientes: sea circuncidado todo varón entre vosotros. Os circuncidaréis la carne del prepucio y esa será la señal de mi alianza con vosotros. A los ocho días de nacer serán circuncidados todos los varones de cada generación: los nacidos en casa y los comprados con dinero a extranjeros que no sean de vuestra raza. Deberán ser circuncidados los nacidos en casa y los comprados con dinero. Así llevaréis en la carne mi alianza como alianza perpetua. Todo varón incircunciso, que no haya circuncidado la carne de su prepucio, será extirpado de mi pueblo, por haber quebrantado mi alianza.",
                citation: "Gén 17,10-14"
            },
            {
                text: "Cuando se cumplieron los días de su purificación, según la ley de Moisés, lo llevaron a Jerusalén para presentarlo al Señor, de acuerdo con lo escrito en la ley del Señor: «Todo varón primogénito será consagrado al Señor», y para entregar la oblación, como dice la ley del Señor: «un par de tórtolas o dos pichones». Había entonces en Jerusalén un hombre llamado Simeón, hombre justo y piadoso, que aguardaba el consuelo de Israel; y el Espíritu Santo estaba con él. Le había sido revelado por el Espíritu Santo que no vería la muerte antes de ver al Mesías del Señor. Impulsado por el Espíritu, fue al templo. Y cuando entraban con el niño Jesús sus padres para cumplir con él lo acostumbrado según la ley, Simeón lo tomó en brazos y bendijo a Dios diciendo: «Ahora, Señor, según tu promesa, | puedes dejar a tu siervo irse en paz. Porque mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos: luz para alumbrar a las naciones | y gloria de tu pueblo Israel». Su padre y su madre estaban admirados por lo que se decía del niño. Simeón los bendijo y dijo a María, su madre: «Este ha sido puesto para que muchos en Israel caigan y se levanten; y será como un signo de contradicción —y a ti misma una espada te traspasará el alma—, para que se pongan de manifiesto los pensamientos de muchos corazones». Había también una profetisa, Ana, hija de Fanuel, de la tribu de Aser, ya muy avanzada en años. De joven había vivido siete años casada, y luego viuda hasta los ochenta y cuatro; no se apartaba del templo, sirviendo a Dios con ayunos y oraciones noche y día. Presentándose en aquel momento, alababa también a Dios y hablaba del niño a todos los que aguardaban la liberación de Jerusalén. Y, cuando cumplieron todo lo que prescribía la ley del Señor, se volvieron a Galilea, a su ciudad de Nazaret. El niño, por su parte, iba creciendo y robusteciéndose, lleno de sabiduría; y la gracia de Dios estaba con él.",
                citation: "Lc 2,22-40"
            },
            {
                text: "Habiendo nacido Jesús en Belén de Judea en tiempos del rey Herodes, unos magos de Oriente se presentaron en Jerusalén preguntando: «¿Dónde está el Rey de los judíos que ha nacido? Porque hemos visto salir su estrella y venimos a adorarlo». Al enterarse el rey Herodes, se sobresaltó y toda Jerusalén con él; convocó a los sumos sacerdotes y a los escribas del país, y les preguntó dónde tenía que nacer el Mesías. Ellos le contestaron: «En Belén de Judea, porque así lo ha escrito el profeta: “Y tú, Belén, tierra de Judá, no eres ni mucho menos la última de las poblaciones de Judá, pues de ti saldrá un jefe que pastoreará a mi pueblo Israel”». Entonces Herodes llamó en secreto a los magos para que le precisaran el tiempo en que había aparecido la estrella, y los mandó a Belén, diciéndoles: «Id y averiguad cuidadosamente qué hay del niño y, cuando lo encontréis, avisadme, para ir yo también a adorarlo». Ellos, después de oír al rey, se pusieron en camino y, de pronto, la estrella que habían visto salir comenzó a guiarlos hasta que vino a pararse encima de donde estaba el niño. Al ver la estrella, se llenaron de inmensa alegría. Entraron en la casa, vieron al niño con María, su madre, y cayendo de rodillas lo adoraron; después, abriendo sus cofres, le ofrecieron regalos: oro, incienso y mirra. Y habiendo recibido en sueños un oráculo, para que no volvieran a Herodes, se retiraron a su tierra por otro camino.",
                citation: "Mt 2,1-12"
            },
            {
                text: "Al verse burlado por los magos, Herodes montó en cólera y mandó matar a todos los niños de dos años para abajo, en Belén y sus alrededores, calculando el tiempo por lo que había averiguado de los magos. Entonces se cumplió lo dicho por medio del profeta Jeremías: «Un grito se oye en Ramá, llanto y lamentos grandes; es Raquel que llora por sus hijos y rehúsa el consuelo, porque ya no viven».",
                citation: "Mt 2,16-18"
            },
            {
                text: "Cuando ellos se retiraron, el ángel del Señor se apareció en sueños a José y le dijo: «Levántate, toma al niño y a su madre y huye a Egipto; quédate allí hasta que yo te avise, porque Herodes va a buscar al niño para matarlo». José se levantó, tomó al niño y a su madre, de noche, se fue a Egipto y se quedó hasta la muerte de Herodes para que se cumpliese lo que dijo el Señor por medio del profeta: «De Egipto llamé a mi hijo». Al verse burlado por los magos, Herodes montó en cólera y mandó matar a todos los niños de dos años para abajo, en Belén y sus alrededores, calculando el tiempo por lo que había averiguado de los magos. Entonces se cumplió lo dicho por medio del profeta Jeremías: «Un grito se oye en Ramá, llanto y lamentos grandes; es Raquel que llora por sus hijos y rehúsa el consuelo, porque ya no viven». Cuando murió Herodes, el ángel del Señor se apareció de nuevo en sueños a José en Egipto y le dijo: «Levántate, coge al niño y a su madre y vuelve a la tierra de Israel, porque han muerto los que atentaban contra la vida del niño». Se levantó, tomó al niño y a su madre y volvió a la tierra de Israel. Pero al enterarse de que Arquelao reinaba en Judea como sucesor de su padre Herodes tuvo miedo de ir allá. Y avisado en sueños se retiró a Galilea y se estableció en una ciudad llamada Nazaret. Así se cumplió lo dicho por medio de los profetas, que se llamaría nazareno.",
                citation: "Mt 2,13-23 MUY LARGA??? INCLUYE LA ANTERIOR (Mt 2,13-15)"
            }
        ];

        // Get the verse number from the URL
        const params = new URLSearchParams(window.location.search);
        const number = parseInt(params.get("q"));

        // Display the selected verse
        if (Number.isInteger(number) && number >= 1 && number <= quotes.length) {

            document.getElementById("quote").textContent =
                '"' + quotes[number - 1].text + '"';

            document.getElementById("citation").textContent =
                "— " + quotes[number - 1].citation;

        } else {

            document.getElementById("quote").textContent =
                "Versiculos explicativos del belén.";

            document.getElementById("citation").textContent = "";

        }
    </script>

</body>
</html>
